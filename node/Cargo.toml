[package]
name = "node"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
homepage.workspace = true

[features]
# Off by default, so a release build has no way to return a wrong answer on
# purpose. `scripts/run-local.sh` turns it on explicitly, because demonstrating
# M-of-N requires a worker that disagrees.
fault-injection = []

[dependencies]
tfhe = { workspace = true }
primitives = { path = "../primitives" }
clap = { workspace = true, features = ["derive"] }
wincode = { workspace = true }
tiny_http = { workspace = true }
ureq = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The chain half (task 3.4). Only `watcher.rs` uses these; every other role in
# this binary still runs with no chain at all.
alloy = { workspace = true }
tokio = { workspace = true }
