\* COUNTEREXAMPLE.  EXPECTED TO FAIL on VoteNotDisplaced.
\*
\* The inbox modelled the other way round: last-write-wins.  Everything else
\* is at its safest setting --- THREE HONEST WORKERS, no faults, an honest
\* coordinator that refuses splits, nobody but the coordinator calling
\* fulfillJob.
\*
\* LateReplayOnly = TRUE is what makes this the experiment the code comment
\* describes rather than a different one.  It forbids a relayed signature
\* from arriving until every live worker has already reported, so the trace
\* TLC finds is unambiguously "a LATE report displaces a vote already cast"
\* and not "a relay got there first" (which is a separate problem, and is
\* MC_ReplayPreempt_N3M2.cfg).
\*
\* coordinator.rs `record` chose the other branch on exactly this reasoning:
\*
\*     // One attester, one attestation, and the *first* one counts. ...
\*     // keeping the first also stops a later message displacing a vote
\*     // already cast, which matters because `/results` accepts a report
\*     // from any registered address and an attestation is not a secret.
\*
\* MC_FWW_Late_N3M2.cfg is the same configuration with that branch restored,
\* and it holds.  MC_LWW_Settles_N3M2.cfg is this configuration again,
\* checking what the displacement leads to.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = FALSE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = TRUE
    MaxFaults = 0
    MinHonest = 3

INVARIANTS
    VoteNotDisplaced
