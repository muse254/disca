\* NON-VACUITY WITNESS.  EXPECTED TO FAIL.
\*
\* Every safety property in this spec is an implication with
\* `chain = "fulfilled"` on the left.  If a job could never be fulfilled,
\* all of them would hold for free and the whole exercise would be theatre.
\* NeverFulfils is checked here so TLC produces a trace in which a job
\* really does settle on-chain at the baseline N = 3, M = 2.
\*
\* NeverRefunds is the same argument for the refund half of EscrowPaidOnce
\* and is checked in MC_Refund_witness.cfg.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    NeverFulfils
