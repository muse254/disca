\* N = 4, M = 2, one faulty worker.  M <= N/2 so a split is arithmetically
\* possible, but one faulty worker cannot produce one on its own, so this is
\* the configuration where every safety property including ResultIsCorrect
\* is expected to hold.  Contrast MC_N4M2.cfg, which allows two.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = TRUE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    TypeOK
    QuorumIsReal
    SomeoneActuallyEvaluated
    EscrowPaidOnce
    NoSettleOnSplit
    ResultIsCorrect
    VoteNotDisplaced
