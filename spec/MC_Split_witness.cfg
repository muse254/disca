\* NON-VACUITY WITNESS.  EXPECTED TO FAIL.
\*
\* NoSplitEver says two groups never both reach M.  It is checked here so
\* that TLC produces a counterexample, and the counterexample is the proof
\* that the state NoSettleOnSplit is about is actually reachable at N = 4,
\* M = 2 --- rather than NoSettleOnSplit holding in MC_N4M2.cfg because
\* nothing ever splits.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 2
    MinHonest = 0

INVARIANTS
    NoSplitEver
