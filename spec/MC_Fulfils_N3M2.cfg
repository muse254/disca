\* LIVENESS, the strong form.  EXPECTED TO PASS.
\*
\* "Eventually settles or refunds" is a low bar --- a coordinator that
\* answered every job with a refund would clear it.  This is the statement
\* worth having: given a deadline generous enough not to cut a viable job
\* short (PatientDeadline), at least M honest workers, and fewer than M
\* faulty ones so no second group can reach quorum, the job is eventually
\* FULFILLED.
\*
\* All three conditions are load-bearing and each maps onto something real:
\* the deadline is `--deadline` and STRAGGLER_GRACE; M honest workers is
\* the deterministic-evaluation assumption plus enough live machines; fewer
\* than M faulty is what M <= N/2 fails to guarantee.

SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = TRUE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 2

INVARIANTS
    TypeOK
    ResultIsCorrect

PROPERTIES
    Liveness
    EventuallyFulfils
