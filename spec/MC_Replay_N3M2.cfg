\* COUNTEREXAMPLE.  EXPECTED TO FAIL on QuorumIsReal.
\*
\* The known, documented limitation.  coordinator.rs:
\*
\*     // Fixed at 1 while there is no chain to take it from. ... Two runs
\*     // of this binary over the same program and inputs both use job 1
\*     // today, and their attestations are interchangeable.
\*
\* PriorJobId = JobId is that sentence as a model parameter.  ReplayAvailable
\* puts an earlier run's signatures in circulation, and since attestations
\* are not secret, anyone can relay them.
\*
\* Note the second half of why this bites, which the code comment does not
\* say: the signed preimage (attest.rs Claim::preimage, all 94 bytes) binds
\* the job id, the bytecode hash and the result hash --- and NOT the input
\* commitments.  So the earlier run does not even have to be the same job.
\* Any earlier run of the same program, over any inputs, yields attestations
\* that verify against this one.  The job id is the only thing that was ever
\* going to separate them, and it is a constant.
\*
\* Fixed in MC_UniqueJobId_N3M2.cfg by making the id unique.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = TRUE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    QuorumIsReal
