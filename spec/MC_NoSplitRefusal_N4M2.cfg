\* COUNTEREXAMPLE.  EXPECTED TO FAIL on NoSettleOnSplit.
\*
\* coordinator.rs `tally` returns None when more than one group reaches
\* quorum.  Take that branch out --- RefuseOnSplit = FALSE, which is the
\* `quorums.pop()` a version without that check would do, "a coin flip
\* decided by hash iteration order" --- and TLC produces the trace where the
\* coordinator settles on a group while a second group also has M.
\*
\* AdversarialFulfill is off so the only party calling fulfillJob is the
\* coordinator: what fails here is the coordinator's decision, not the
\* contract's check.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = FALSE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 2
    MinHonest = 0

INVARIANTS
    NoSettleOnSplit
