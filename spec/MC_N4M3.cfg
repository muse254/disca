\* N = 4, M = 3.  M > N/2, so two groups can never both reach quorum: this
\* is the configuration where the split of property 3 is unreachable, and
\* NoSettleOnSplit holds for a reason (arithmetic) rather than by refusal.
\* One faulty worker is the tolerance, N - M = 1.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 3
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = TRUE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    TypeOK
    QuorumIsReal
    SomeoneActuallyEvaluated
    EscrowPaidOnce
    NoSettleOnSplit
    ResultIsCorrect
    VoteNotDisplaced
