\* COUNTEREXAMPLE.  EXPECTED TO FAIL on QuorumIsReal.
\*
\* The registry check removed.  Two unregistered signers holding keys they
\* generated themselves sign for `bad`, both signatures recover cleanly to
\* two distinct addresses, and a quorum of two forms out of parties nobody
\* ever agreed to accept work from.
\*
\* coordinator.rs says why the registry is there:
\*
\*     // ...recovery alone tells you *who* signed, not whether that party
\*     // is anyone this network has agreed to accept work from. Without it,
\*     // anybody with a keyboard can generate M keypairs and out-vote the
\*     // honest workers for free.
\*
\* This is that sentence checked.  A valid signature is worth nothing on its
\* own; the registry is what turns "some address" into "a worker".

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {s1, s2}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = FALSE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 0
    MinHonest = 3

INVARIANTS
    QuorumIsReal
