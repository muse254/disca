\* COUNTEREXAMPLE.  EXPECTED TO FAIL on EscrowPaidOnce.
\*
\* EscrowPaidOnce is close to true by construction, which is a fair thing to
\* be suspicious of.  This configuration removes the one guard that makes it
\* true --- refundOnTimeout requiring the job to still be Open (bridge.md
\* 2's `JobState` and 6's refund path) --- and TLC immediately finds the
\* trace where a job is fulfilled, the deadline then passes, and the escrow
\* is paid a second time as a refund.
\*
\* That is what makes the guard load-bearing rather than decorative, and it
\* is the check to look for first when DiscaBridge.sol is actually written:
\* the contract does not exist yet (bridge.md 8 step 1), so this invariant
\* is a specification of what it must do, not a verification of what it
\* does.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = FALSE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    EscrowPaidOnce
