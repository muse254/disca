\* COUNTEREXAMPLE.  EXPECTED TO FAIL on SomeoneActuallyEvaluated.
\*
\* The sharpest form of the constant-job-id replay: a job that settles
\* on-chain, with a quorum the contract verifies by ecrecover, where NO
\* worker evaluated anything for the current job at all.
\*
\* MinHonest = 0 and MaxFaults = 0 let TLC pick the assignment in which every
\* worker crashed.  The replayed signatures are still valid --- they are real
\* secp256k1 signatures over (jobId = 1, this bytecode hash, that result) ---
\* so `Verifier::attribute` attributes them, the inbox fills, the tally
\* reaches M and fulfillJob's ecrecover loop is satisfied.
\*
\* Nothing in the protocol is broken in this trace.  Every check passes.
\* That is the point: a constant job id is not a weak check, it is the
\* absence of the only thing that would distinguish this run from the last.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 0
    MinHonest = 0

INVARIANTS
    SomeoneActuallyEvaluated
