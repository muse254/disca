\* NON-VACUITY WITNESS for the liveness checks.  EXPECTED TO FAIL on the
\* temporal property EventuallyFulfils.
\*
\* Identical to MC_Fulfils_N3M2.cfg except that the deadline is no longer
\* generous: PatientDeadline = FALSE lets it expire at any moment, including
\* before a single worker has answered.  The job is then refunded rather
\* than fulfilled, and `<>(chain = "fulfilled")` is false.
\*
\* Two things at once.  It shows TLC is really checking the temporal
\* properties rather than accepting them --- a liveness check that cannot
\* fail is worth nothing --- and it shows which hypothesis of the strong
\* liveness claim is doing the work: not the fault count, the deadline.  A
\* short deadline does not break the system, it turns every job into a
\* refund, which is bridge.md 6 working as designed and a coprocessor that
\* computes nothing.

SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 2

PROPERTIES
    EventuallyFulfils
