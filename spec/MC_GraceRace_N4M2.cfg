\* COUNTEREXAMPLE.  EXPECTED TO FAIL on ResultIsCorrect.
\*
\* Found by TLC while checking something else, and it is about the shipping
\* code rather than about a knob turned off: RefuseOnSplit = TRUE here, the
\* coordinator is honest, nobody is calling fulfillJob but the coordinator,
\* and there is no replay.  The only thing outside tolerance is the fault
\* count: two faulty workers at N = 4, M = 2, which M <= N/2 permits.
\*
\* The trace does not involve a split at all --- `settleSplit` is FALSE in
\* every state, so the refusal branch is never even reached:
\*
\*   1. w3 (faulty) evaluates and reports `bad`.
\*   2. w4 (faulty) evaluates and reports `bad`.
\*   3. STRAGGLER_GRACE expires.  w1 and w2, the honest workers, have not
\*      reported --- FHE evaluation is seconds of work (architecture.md 2:
\*      225 ms per add, 2.04 s per multiply) and the grace is 5 s.
\*   4. `tally` sees exactly one group at M and returns it.  The job settles
\*      on `bad`.
\*
\* This is `collect` behaving as written.  It settles when a quorum exists
\* AND (everyone reported OR the grace expired); the second disjunct is the
\* race.  The split-refusal check cannot help, because from the
\* coordinator's point of view there is nothing to refuse: it never sees the
\* honest group.
\*
\* What it costs and what it does not.  It is not a soundness failure of
\* attestation --- QuorumIsReal holds, two registered workers really did
\* sign `bad` for this job --- it is the same statement as MC_SplitCost:
\* with M <= N/2 the fault threshold has been exceeded and agreement stops
\* implying correctness.  Refusing a visible split closes the case where
\* both groups arrive; it cannot close the case where only the wrong one
\* does.  The fix is not a longer grace period (a faulty worker can always
\* be faster than an honest one, because it need not evaluate) --- it is
\* choosing M > N/2, which makes a second group arithmetically impossible.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 2
    MinHonest = 2

INVARIANTS
    ResultIsCorrect
