\* EXPECTED TO PASS.  A negative result, and worth having.
\*
\* Last-write-wins, but with unique job ids and workers that do not
\* equivocate.  VoteNotDisplaced holds anyway.
\*
\* The reason is worth stating, because it bounds the claim in
\* MC_LWW_N3M2.cfg: the inbox is keyed by the RECOVERED address, so the only
\* thing that can overwrite a party's slot is a second signature by that
\* same party over a different result.  There are exactly two sources for
\* one --- an earlier run under a job id that repeats, or a signer that
\* equivocates.  Remove both and last-write-wins and first-write-wins are
\* indistinguishable.
\*
\* So first-write-wins is not redundant with unique job ids: it is the
\* defence that still stands when a signer equivocates
\* (MC_LWW_Equivocation_N3M2.cfg), and it is the one that is load-bearing
\* today, because job ids are the constant 1.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 0
    FirstWriteWins = FALSE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    TypeOK
    VoteNotDisplaced
    QuorumIsReal
    NoSettleOnSplit
    EscrowPaidOnce
