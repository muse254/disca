\* EXPECTED TO PASS.  The control for MC_LWW_N3M2.cfg, and the pair that
\* makes the first-write-wins argument.
\*
\* Identical in every constant except FirstWriteWins = TRUE, which is what
\* coordinator.rs `record` does.  The same three honest workers report, the
\* same two late replayed attestations are relayed at them, and this time
\* nothing happens: their slots are taken, `Entry::Occupied` returns
\* `AlreadyVoted`, and the tally still shows the answer the workers gave.
\*
\* VoteNotDisplaced and ResultIsCorrect both hold.  One Boolean apart from
\* MC_LWW_Settles_N3M2.cfg, which settles on the wrong ciphertext.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = TRUE
    MaxFaults = 0
    MinHonest = 3

INVARIANTS
    TypeOK
    VoteNotDisplaced
    ResultIsCorrect
    QuorumIsReal
    SomeoneActuallyEvaluated
    NoSettleOnSplit
    EscrowPaidOnce
