\* N = 3, M = 3.  M = N, so there is no fault tolerance at all: one slow,
\* crashed or diverging worker blocks the job (architecture.md 3, "too
\* high").  Included because it is the configuration where the safety
\* properties are easiest to satisfy and liveness is hardest, and because
\* `--attesters 3` against three workers is a thing an operator will type.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 3
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = TRUE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 0
    MinHonest = 0

INVARIANTS
    TypeOK
    QuorumIsReal
    SomeoneActuallyEvaluated
    EscrowPaidOnce
    NoSettleOnSplit
    ResultIsCorrect
    VoteNotDisplaced
