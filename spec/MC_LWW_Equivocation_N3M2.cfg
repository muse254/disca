\* COUNTEREXAMPLE.  EXPECTED TO FAIL on VoteNotDisplaced.
\*
\* Last-write-wins with unique job ids, no replay, but one worker that
\* signs two different results for the same job.  coordinator.rs names this
\* case exactly:
\*
\*     // A second attestation over a different result is signed evidence
\*     // that one signer said two things about one job, and with unique job
\*     // ids the right response would be to discard that signer's vote
\*     // entirely.
\*
\* Under last-write-wins the signer's SECOND statement is the one that
\* counts, which is the worst of the three available answers (keep the
\* first, keep the last, discard the signer).  This is why closing the
\* replay hole does not make first-write-wins removable.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 0
    FirstWriteWins = FALSE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = TRUE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    VoteNotDisplaced
