\* N = 4, M = 2, TWO faulty workers --- the fault threshold exceeded, which
\* is the state a split means the system is in (coordinator.rs `tally`:
\* "that means the fault threshold has been exceeded and neither answer is
\* trustworthy").
\*
\* ResultIsCorrect is deliberately NOT checked here and its absence is the
\* finding, not an omission: with two faulty workers agreeing on one wrong
\* answer there are two real quorums, both genuinely signed.  The
\* coordinator refuses to choose between them, but anyone holding the two
\* faulty signatures can call fulfillJob with them, and the contract has no
\* basis on which to refuse.  QuorumIsReal survives that --- the signers are
\* real, registered and distinct --- and correctness does not.  That is the
\* precise boundary of what M-of-N buys, and it is why M <= N/2 is a
\* configuration error rather than a tunable.
\*
\* See MC_SplitCost_N4M2.cfg for the same point made against an honest
\* coordinator that picks a group instead of refusing.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = TRUE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 2
    MinHonest = 0

INVARIANTS
    TypeOK
    QuorumIsReal
    SomeoneActuallyEvaluated
    EscrowPaidOnce
    NoSettleOnSplit
    VoteNotDisplaced
