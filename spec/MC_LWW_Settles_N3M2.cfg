\* COUNTEREXAMPLE.  EXPECTED TO FAIL on ResultIsCorrect.
\*
\* MC_LWW_N3M2.cfg again, checking the consequence rather than the mechanism.
\* Displacing a vote is only interesting if something downstream changes, and
\* it does: three honest workers unanimously attest to the right answer, two
\* late replayed reports overwrite two of their slots, the tally now shows a
\* single clean quorum on the wrong answer, and the job settles on-chain.
\*
\* Nobody misbehaved.  No worker was faulty, no worker was slow, the
\* coordinator followed its own rules, and the contract's ecrecover loop is
\* satisfied by two real signatures from two real registered workers.  The
\* only defect is a line in the inbox that says "later wins".

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = FALSE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = TRUE
    MaxFaults = 0
    MinHonest = 3

INVARIANTS
    ResultIsCorrect
