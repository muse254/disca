# The code `DiscaAttestation.tla` claims to model, and what it looked like when
# that claim was last checked by a person.
#
# `drift.py --check` recomputes each hash and fails when one moves. Comments and
# formatting are stripped first, so rewording a comment or running `cargo fmt`
# does not trip it; changing what the code does will.
#
# This is a tripwire, not a proof of correspondence — there is no extraction and
# no refinement between the model and the Rust, and `README.md` says so. What it
# provides is that drift surfaces as a build failure at the moment it is
# introduced, rather than as an archaeology problem later.
#
# `models` is not documentation. It is the question `--update` asks you: if you
# cannot say what the item corresponds to in the spec, you are not in a position
# to accept its new hash.

