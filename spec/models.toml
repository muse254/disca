# The code `DiscaAttestation.tla` claims to model, and what it looked like when
# that claim was last checked by a person.
#
# `drift.py --check` recomputes each hash and fails when one moves. Comments and
# formatting are stripped first, so rewording a comment or running `cargo fmt`
# does not trip it; changing what the code does will.
#
# This is a tripwire, not a proof of correspondence — there is no extraction and
# no refinement between the model and the Rust, and `README.md` says so. What it
# provides is that drift surfaces as a build failure at the moment it is
# introduced, rather than as an archaeology problem later.
#
# `models` is not documentation. It is the question `--update` asks you: if you
# cannot say what the item corresponds to in the spec, you are not in a position
# to accept its new hash.
#
# ---------------------------------------------------------------------------
# A note the hashes cannot carry, recorded when the coordinator became a job
# service (`docs/next-architecture.md` §4, step 3).
#
# That change keyed every piece of a job's state by job id: one inbox, one
# verifier, one dispatch set and one deadline *per job* rather than per process.
# None of the items below moved a line — `attribute`, `record`, `group`,
# `tally`, `agreement_still_possible` and `quorum_error` were already functions
# of one job's state, and there was simply only ever one job's state to hand
# them — so nothing here needed re-recording, and none of these hashes was
# accepted rather than earned.
#
# What did change is the *quantifier*. `DiscaAttestation.tla` models one job,
# and every item below now describes one job among several rather than the only
# one there is. The model still describes each of them exactly, because it
# describes a job in isolation and isolation is now structural: two jobs share
# the map they are looked up in and nothing else.
#
# What the model does not describe, and did not before either, is anything
# *between* two concurrent jobs. `README.md` lists that under "what could not be
# verified" ("Concurrent jobs. One job."), where it used to be a hypothetical.
# It is now a live gap: the code has behaviour — routing a report to a job by
# the id it names, refusing one for a job nobody accepted — that no configuration
# in this directory checks. `two_jobs_in_flight_settle_independently` in
# `node/src/coordinator.rs` is a unit test standing where a model check should
# be, and a unit test is a fact about one interleaving.
# ---------------------------------------------------------------------------
# A second such note, recorded when the chain watcher landed (task 3.4).
#
# One item moved, and only in its declaration: `fn quorum_error(` is now
# `pub(crate) fn quorum_error(`. `--check` reported it as GONE rather than
# CHANGED because the anchor matches on the declaration line, and that line is
# part of what gets hashed — so this hash was re-recorded for one keyword. The
# body is byte-identical, and `2M > N` is the whole of what the model says about
# this function.
#
# The keyword is there because there is now a second caller for a rule the
# model treats as global. `node/src/watcher.rs` calls it at startup, with M read
# from `registerProgram` and N from `--worker`, so a deployment whose on-chain
# quorum is not a majority of the operator's workers is refused before it
# watches anything. Same rule, same strength, applied earlier; `accept_job`
# still applies it per job, and that is the call the model corresponds to.
#
# Nothing else here moved. The watcher settles through `Coordinator::settle` and
# `fulfillJob` unchanged. What is new is what the model does not reach:
# `DiscaAttestation.tla` starts at a dispatched job and says nothing about where
# a job comes from, so `JobRequested` -> `verify_inputs` -> `accept_job` is
# unmodelled — including the commitment check that is the point of task 2.9f.
# That belongs in `README.md`'s "what could not be verified" list beside
# concurrent jobs, and is recorded here until somebody puts it there: this file
# is what a person reads when they are deciding whether the model still covers
# what they changed, which is exactly when it matters.
# ---------------------------------------------------------------------------

