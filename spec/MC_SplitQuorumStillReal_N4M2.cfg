\* EXPECTED TO PASS.  The other half of MC_SplitCost_N4M2.cfg.
\*
\* Same coordinator that settles a split, same two faulty workers.  The
\* claim being checked is that QuorumIsReal is NOT what a split breaks: even
\* when the coordinator settles on the wrong group, the M signatures behind
\* it are real ones made by real registered workers for this job.
\*
\* That is worth pinning because it is the tempting mistake.  "The quorum was
\* fake" is the intuitive story for a split, and it is wrong; the quorum is
\* genuine and the inference from it is what fails.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = FALSE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 2
    MinHonest = 0

INVARIANTS
    TypeOK
    QuorumIsReal
    SomeoneActuallyEvaluated
    EscrowPaidOnce
