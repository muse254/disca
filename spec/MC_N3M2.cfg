\* Baseline: the shipping configuration.  N = 3, M = 2, which is what
\* scripts/run-local.sh runs and what docs/attestation.md 2 describes.
\* One faulty worker is the tolerance (N - M = 1); no replay in circulation;
\* the coordinator's own decisions are as coordinator.rs makes them.
\*
\* fulfillJob is open to anyone holding signatures (AdversarialFulfill), so
\* QuorumIsReal here is a property of the contract's checks and not of the
\* coordinator behaving.  That is the shape bridge.md 2a specifies and the
\* shape 2b says the earlier address-list design did not have.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = TRUE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    TypeOK
    QuorumIsReal
    SomeoneActuallyEvaluated
    EscrowPaidOnce
    NoSettleOnSplit
    ResultIsCorrect
    VoteNotDisplaced
