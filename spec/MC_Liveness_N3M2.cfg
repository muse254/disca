\* LIVENESS.  EXPECTED TO PASS.
\*
\* Under weak fairness on every protocol action, the job never hangs: the
\* escrow is always eventually settled, either by fulfillJob or by
\* refundOnTimeout (bridge.md 6, "Coordinator goes silent ->
\* refundOnTimeout returns escrow").
\*
\* MaxFaults = 1 < M = 2, so fewer than M workers are faulty; crashed and
\* failing workers are left unconstrained, because a job that hangs when a
\* worker dies is exactly the failure this is meant to exclude.
\*
\* Weak fairness, not strong: every action here, once enabled, stays enabled
\* until it is taken, so WF is the right strength and SF would be assuming
\* more than the implementation provides.

SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 1
    MinHonest = 0

INVARIANTS
    TypeOK

PROPERTIES
    Liveness
