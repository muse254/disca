\* COUNTEREXAMPLE.  EXPECTED TO FAIL on ResultIsCorrect.
\*
\* This one was not anticipated when the spec was written; TLC found it as
\* an unexpected failure of what was meant to be a control configuration,
\* and it is the most useful thing in the directory.
\*
\* Setup: three HONEST workers, no faults, first-write-wins as the code has
\* it, an honest coordinator that refuses splits, nobody but the coordinator
\* calling fulfillJob.  The only thing wrong is the constant job id, with an
\* earlier run's attestations in circulation.
\*
\* The trace:
\*
\*   1. A relayer posts w1's earlier-run signature for `good`.
\*   2. It posts w2's earlier-run signature for `bad`.
\*   3. It posts w3's earlier-run signature for `bad`.
\*   4. The coordinator tallies: one group, {w2, w3}, at M = 2.  It settles
\*      on `bad` and the contract fulfils.
\*
\* No worker had started evaluating.  Nothing was displaced --- `displaced`
\* is FALSE in every state --- so VoteNotDisplaced holds throughout.  The
\* honest workers' real attestations arrive to find their slots already
\* taken and are refused, by the very rule that was protecting them.
\*
\* The lesson is about what first-write-wins is for.  It defends a vote
\* already cast; it cannot defend a vote not yet cast, and under a repeated
\* job id an attacker who is faster than an FHE evaluation (a bar measured
\* in seconds --- architecture.md 2: 225 ms per add, 2.04 s per multiply)
\* votes on the workers' behalf before they can.  First-write-wins and
\* unique job ids are not alternatives; the first is a partial mitigation
\* and only the second closes the hole.  MC_UniqueJobId_N3M2.cfg is the
\* same configuration with the id made unique, and it passes.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 0
    MinHonest = 3

INVARIANTS
    ResultIsCorrect
