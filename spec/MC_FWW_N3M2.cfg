\* EXPECTED TO PASS.  The control for MC_LWW_N3M2.cfg.
\*
\* Byte for byte the same configuration --- three honest workers, an earlier
\* run's contradicting signatures in circulation, a constant job id --- with
\* FirstWriteWins = TRUE, which is what coordinator.rs `record` does.
\*
\* VoteNotDisplaced holds: no report ever overwrites a slot already filled,
\* so no vote a worker cast for this job can be taken back by anyone.  That
\* is the property first-write-wins buys, and it is exactly the property the
\* comment above `record` claims for it.
\*
\* ResultIsCorrect is deliberately NOT checked here, and its absence is a
\* finding rather than an oversight.  See MC_ReplayPreempt_N3M2.cfg: with a
\* constant job id, first-write-wins stops a replay DISPLACING a vote and
\* does nothing about a replay PRE-EMPTING one.  The two are different
\* attacks and only the first is closed here.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = TRUE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = TRUE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 0
    MinHonest = 3

INVARIANTS
    TypeOK
    VoteNotDisplaced
    NoSettleOnSplit
    EscrowPaidOnce
