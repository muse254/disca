\* COUNTEREXAMPLE.  EXPECTED TO FAIL on SplitSettlementWasCorrect.
\*
\* What settling a split actually costs.  A coordinator that picks a group
\* instead of refusing (RefuseOnSplit = FALSE) is asked the narrow question:
\* when you settled a job where TWO groups had reached M, was the group you
\* picked the right one?
\*
\* TLC's answer is no, and the trace is a coin flip landing badly: two honest
\* workers attest to `good`, two faulty workers attest to `bad`, both groups
\* are at M = 2, and the coordinator settles on `bad`.  coordinator.rs calls
\* the alternative what it is --- "a coin flip decided by hash iteration
\* order" --- and this is the flip losing.
\*
\* Note what it does NOT violate: QuorumIsReal.  Those two faulty workers
\* really did sign, really are registered and really are distinct, so the
\* contract's ecrecover loop passes and would pass on-chain.  See
\* MC_SplitQuorumStillReal_N4M2.cfg, which checks exactly that and holds.
\*
\* That is the whole argument for refusing.  Once two groups reach M, "M
\* distinct registered workers signed R" has stopped implying "R is right",
\* and nothing downstream can tell which group was which --- not the
\* contract, and not the key holder, who (docs/attestation.md 1) "decrypts
\* to a number.  A wrong ciphertext decrypts to a wrong number just as
\* cleanly."  Refusing is the only answer that does not silently hand
\* somebody a wrong plaintext they have no reason to doubt.

INIT Init
NEXT Next

CONSTANTS
    Workers = {w1, w2, w3, w4}
    Strangers = {}
    M = 2
    Results = {good, bad}
    TrueResult = good
    JobId = 1
    PriorJobId = 1
    FirstWriteWins = TRUE
    RefuseOnSplit = FALSE
    RegistryEnforced = TRUE
    RefundGuarded = TRUE
    AdversarialFulfill = FALSE
    ReplayAvailable = FALSE
    EquivocatingFaults = FALSE
    PatientDeadline = FALSE
    LateReplayOnly = FALSE
    MaxFaults = 2
    MinHonest = 2

INVARIANTS
    SplitSettlementWasCorrect
