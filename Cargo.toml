[workspace]
resolver = "2"
members = ["committee-tally", "disca-cli", "node", "primitives", "simple-arithmetic"]

[workspace.package]
version = "0.2.0"
authors = ["Osoro Bironga <fanosoro@gmail.com>"]
edition = "2024"
description = "Distributed Compute Automata"
homepage = "https://github.com/muse254/disca"
license = "MIT"

[workspace.dependencies]
clap = "4.5"
wasmparser = "0.244.0"
wast = "244.0.0"
# Pinned exactly. Byte-reproducible evaluation depends on `setup_custom_fft_plan`
# (see `pin_fft_plan` in node/src/main.rs), which is public but `#[doc(hidden)]`
# and carries no stability promise, and on the polynomial size that
# `ConfigBuilder::default()` selects. A minor bump could change either without
# warning, and the symptom would be honest workers silently disagreeing.
tfhe = { version = "=1.5.0", features = ["boolean", "shortint", "integer"] }
primitives = { path = "primitives" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
wincode = { version = "0.6", features = ["derive"] }
rayon = "1.10"
tiny_http = "0.12"
ureq = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha3 = "0.10"
# secp256k1 for the per-worker attestation signatures (task 2.10i).
#
# Chosen over the `secp256k1` crate (bindings to libsecp256k1) because it is
# pure Rust: nothing here needs a C toolchain, and a worker's build staying
# reproducible across machines is the same property M-of-N rests on. It gives
# *recoverable* (r, s, v) signatures directly, which is what lets a Solidity
# `ecrecover` verify an attestation without also carrying a 64-byte public key
# per attester in calldata.
#
# 0.13 rather than the newer 0.14: `alloy-primitives` (which `bridge.md` §8
# names for the chain watcher) still depends on `k256 ^0.13`, and one secp256k1
# implementation in the graph is worth more than a version number.
#
# Default features are off because `schnorr` and `pkcs8` are unused; ECDSA
# signing/verification plus the precomputed basepoint tables is the whole of
# what an attestation needs.
k256 = { version = "0.13", default-features = false, features = [
  "ecdsa",
  "precomputed-tables",
  "std",
] }

# Dependencies (tfhe especially) are unusably slow when built unoptimized:
# the adder truth-table tests take ~8 min in a plain debug build. Optimizing
# only dependencies keeps our own crates fast to compile and debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
