name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `cargo audit` reads a database that changes without this repo changing, so
  # the advisory job needs a clock of its own. Mondays, 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a failing FHE test is the difference between "it broke" and
  # "it broke here"; the suite is small enough that the noise costs nothing.
  RUST_BACKTRACE: 1

jobs:
  # Cheap and independent of the build, so it fails in under a minute rather
  # than after tfhe has finished compiling.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins stable, and stable rustfmt silently ignores
      # four of the five options in rustfmt.toml (imports_granularity,
      # group_imports, format_code_in_doc_comments, error_on_unformatted are all
      # nightly-only). This gate therefore checks less than rustfmt.toml asks
      # for. Enforcing the rest means running rustfmt from nightly, which is a
      # separate decision: the tree does not currently satisfy those four
      # options, so turning them on is a reformat, not a CI change.
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  # The gate in front of the expensive job. Check-only, so it costs minutes
  # rather than hours, and `test` waits on it: a compile error used to burn a
  # two-hour runner and report nothing.
  check:
    name: check and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own key. Check output is `.rmeta`; the jobs below need `.rlib`s,
          # and a GitHub cache key is immutable — whoever finishes first claims
          # it. This job finishes in minutes, so sharing a key with `test` means
          # this job always wins and `test` restores a cache with no codegen in
          # it, recompiling tfhe from cold on every run forever.
          key: check
      # --all-features, because `logic_gates` sits behind `boolean-circuits` and
      # `--faulty` behind `fault-injection`. Code behind an off-by-default
      # feature is never compiled by an ordinary build, so nothing type-checks
      # it and it rots (task 2.11b). --all-targets extends the same reach to
      # tests, examples and benches.
      #
      # --locked so a manifest edit committed without its Cargo.lock update
      # fails here rather than resolving to whatever is newest today; the tfhe
      # pin is load-bearing (docs/architecture.md §3).
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The other half, and not redundant: --all-features cannot see a missing
      # feature gate, because under it every gate is open. This is the shape a
      # release build actually compiles, and it is where the `fault-injection`
      # gate has to hold. It runs in this job rather than its own so that it
      # reuses the dependency metadata clippy just built, in the same target
      # directory — a separate job would build all of it again.
      - run: cargo check --workspace --all-targets --locked

  deps:
    name: dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No build cache here on purpose: nothing in this job compiles the
      # workspace. `cargo metadata` resolves, `cargo audit` reads Cargo.lock.
      # A prebuilt binary, and deliberately the current release: the advisory
      # database now carries CVSS 4.0 entries that cargo-audit before 0.22
      # cannot parse, and it fails loading the database rather than reporting no
      # advisories — a stale pin here looks like a broken dependency tree.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Lockfile in sync, `tfhe` still pinned exactly, one tfhe in the graph,
      # plus advisories and a read-only report of what could be updated. See the
      # header of scripts/check-deps.sh for why this is not `cargo update`.
      - run: scripts/check-deps.sh --report --audit

  test:
    name: build and test
    runs-on: ubuntu-latest
    needs: check
    # Measured, not guessed: run 32418404658 did the whole job — cold cache,
    # full dependency build including tfhe, and the entire suite — in 12
    # minutes. 60 is five times that, which is headroom for a slow runner
    # without paying for a sick one.
    #
    # Sizing this generously is a trap. Run 32387542640 took 3h15m for the same
    # work, and it was not the build being expensive: tfhe compiled in about
    # four minutes in *both* runs, and the slow one stalled for nearly three
    # hours in the early dependency phase doing what the fast one did in two.
    # That is a degraded runner, and the right response is to kill it and
    # retry, not to buy it four hours of billable time. If this starts timing
    # out on healthy runners, raise it — but check the log for a stall before
    # assuming the build simply got bigger.
    timeout-minutes: 60
    # Debug info is the bulk of what gets cached, and none of it is needed to
    # know a test failed. line-tables-only keeps file and line in a backtrace —
    # the reason RUST_BACKTRACE is on above — and drops the rest.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # Deliberately NOT shared with `check`. A GitHub cache key is
          # immutable: the first job to finish writes it and every later job
          # with the same key is refused. `check` finishes in minutes with a
          # cache of `.rmeta` — check output — while this job needs `.rlib`s,
          # the codegen that actually costs hours. Sharing one key means
          # `check` always wins the race, this job restores a cache with no
          # codegen in it, and tfhe is compiled from cold on every run forever.
          # That is not hypothetical: in run 32255892950 `check` saved at
          # 13:06:48 and this job restored nothing.
          key: test
          # cache-on-failure is deliberately OFF, and that is the opposite of
          # the obvious choice. It was on, and it poisoned this cache.
          #
          # `concurrency: cancel-in-progress` kills this job on every new push,
          # usually mid-tfhe. With cache-on-failure the dying job wrote its
          # half-built target directory under the canonical key — and a GitHub
          # cache key is immutable, while rust-cache skips saving whenever it
          # restored a full match. So the partial tree became permanent: run
          # 32387542640 restored it, rebuilt everything in 3h15m, logged
          # "Cache up-to-date", and threw all of it away. Every later run would
          # have done the same, forever.
          #
          # Off, a cancelled run saves nothing and the next one simply tries
          # again from cold. What it costs is the case this was meant for — a
          # genuine test failure, where the build was complete and only the
          # tests failed. That is worth losing to keep the cache truthful.

      # committee-tally, ping-pong and simple-arithmetic are Rust only so
      # rustc can emit WASM from them; the committed .wasm files are what the
      # tests evaluate.
      # They build for the host from the workspace root — their
      # .cargo/config.toml only applies to cargo invoked from inside their
      # directory — but building them for wasm32 is what the demo actually
      # depends on, so check that shape too.
      - name: build the demo circuits for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release -p committee-tally -p ping-pong -p simple-arithmetic \
            --target wasm32-unknown-unknown --locked

      # `primitives/tests/determinism_under_concurrency.rs` spawns concurrent
      # child processes and is the guard on byte-reproducible evaluation. It
      # runs here uninstrumented, which is the shape a worker actually runs in.
      - name: test
        run: cargo test --workspace --all-features --locked

      # `node` is the only crate whose *behaviour* differs without a feature: a
      # default build has no `--faulty` flag, and the test asserting the flag is
      # refused only exists there. Under --all-features it is not compiled, so
      # without this step it would be checked and never run. Only `node`,
      # because the FHE suite is the expensive part and it is feature-blind.
      - name: test node without its features
        run: cargo test -p node --locked

  # Coverage runs here on `main` only, and locally on `pre-push` for everyone
  # else (.pre-commit-config.yaml). Two gates, deliberately, because each
  # covers the other's gap.
  #
  # Not on PR pushes: cargo-llvm-cov builds into its own target directory with
  # RUSTC_WRAPPER set, so it shares no artifacts with `test` and pays for the
  # dependency graph a second time — roughly doubling what a push costs, for
  # numbers a developer already saw locally a minute before pushing.
  #
  # But on `main`, because the local hook is the only other gate and
  # `--no-verify` skips it. Once per merge, this is the check that cannot be
  # bypassed, and the one that fails loudly if someone's laptop was lying.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Same reasoning as `test`: sized off a measured cold run, not off the
    # 3h15m outlier that was a degraded runner. See its comment.
    timeout-minutes: 60
    # Measured: dropping debug info leaves every coverage number identical
    # (llvm-cov reads the __llvm_covmap section, not DWARF) and takes the
    # cached target directory from 2.8 GB to 596 MB — which is uploaded and
    # downloaded on every run.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own key, because this job builds into target/llvm-cov-target
          # with RUSTC_WRAPPER set and shares no fingerprint with `test`.
          # rust-cache follows the nested target directory (it carries a
          # CACHEDIR.TAG), so the dependency artifacts inside it are cached.
          #
          # Worth knowing before optimising this job: cargo-llvm-cov's wrapper
          # adds -C instrument-coverage to workspace crates *only* — tfhe is
          # built here exactly as `test` builds it — and its default clean
          # removes workspace artifacts, not dependencies. Measured locally, a
          # warm re-run rebuilds primitives and node and nothing else: 63 s
          # against 285 s cold.
          #
          # No cache-on-failure here either, for the reason spelled out in
          # `test`: a run cancelled mid-build would write a partial tree under
          # an immutable key and starve every run after it.
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The same script, and the same gate, that runs on pre-push. A number
      # here that a developer cannot reproduce locally would be worse than no
      # number at all.
      - name: measure coverage
        run: scripts/coverage.sh --check --lcov target/lcov.info

      - name: upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html/
          retention-days: 14

      - name: upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/lcov.info
          retention-days: 14

  # The Ethereum bridge (bridge/, docs/bridge.md). Independent of every job
  # above: no cargo, no Rust cache, nothing shared. It needs no `needs:` for
  # the same reason — solc compiles the whole of bridge/ in about two seconds,
  # so there is no expensive job to gate.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    # Minutes, not hours. If this ever approaches the limit, something is
    # wrong with the runner rather than with the contracts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # forge-std is a submodule (bridge/lib/forge-std). Without this the
          # directory checks out empty and every import fails.
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned for the same reason solc is pinned in bridge/foundry.toml,
          # and found the hard way: `stable` moved to forge 1.8.0 overnight and
          # test/FulfillGas.t.sol went red without a line of Solidity changing.
          # 1.8.0 counts the measured call's calldata, plus a flat 40,300, into
          # the `gasleft()` delta that the test calls execution gas -- exactly
          # `old + calldata_gas + 40_300` at every M, so the contract costs what
          # it always did and the meter moved. Unpin once the test measures
          # something a forge release cannot redefine.
          version: v1.7.1

      # solc is pinned in bridge/foundry.toml and downloaded on first use; the
      # attestation digest is a cross-language contract with
      # primitives/src/attest.rs, so the compiler version is not a detail.
      - name: build
        run: forge build
        working-directory: bridge

      # -vv so the gas table in test/FulfillGas.t.sol is printed in the log
      # rather than only living in a comment. The numbers in docs/bridge.md §1
      # were arithmetic; these are measured, and a run that silently drifts is
      # how they go stale again.
      - name: test
        run: forge test -vv
        working-directory: bridge

  # The TLA+ specification of M-of-N attestation and settlement (spec/).
  #
  # Independent of the Rust build: nothing in this job compiles the
  # workspace, so it needs no rust-cache key and no `needs:`. It runs in
  # under a minute on eight cores, which is why it is not gated behind
  # `check` the way `test` is.
  #
  # spec/check.sh fails in both directions and that is the point. Half the
  # configurations are counterexamples that are *supposed* to violate a named
  # invariant, and the script exits non-zero if one of those stops finding
  # its counterexample. A spec that only checks "no errors were found" cannot
  # tell a proof from a model that stopped modelling anything, so the gate
  # has to notice when a check goes quiet.
  spec:
    name: tla+ model check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # TLC needs a JVM and nothing else. Temurin 21 rather than latest: TLA+
      # 1.7.4 targets Java 11+, and pinning a major keeps a JDK release from
      # turning into a failure in this job.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # tla2tools.jar is fetched rather than committed, and pinned by SHA-256
      # in check.sh. Fetching it in a step of its own means a download failure
      # says "download" instead of "model check".
      - name: fetch tla2tools.jar
        run: make -C spec jar
      # Before TLC, not after. The model checks itself against itself, so it
      # passes just as cheerfully when the code it claims to describe has been
      # rewritten underneath it — and a green model check is read as evidence.
      # This says which function moved and what the spec models it as.
      - name: check the modelled code has not drifted
        run: make -C spec drift

      - name: check every configuration
        run: make -C spec check
      # The counterexample traces are the readable output of this job, and a
      # failure here is almost always "which trace changed".
      - name: upload the TLC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-logs
          path: spec/out/*.log
          retention-days: 14

  # The bridge against a real chain: scripts/run-anvil.sh, in the mode that
  # needs no Rust (task 3.3).
  #
  # The script has two modes and only one of them belongs here.
  #
  # `--synthetic` starts an Anvil, deploys, registers workers and a program,
  # posts a job through `CommitteeTally`, settles it with real secp256k1
  # signatures over the docs/bridge.md §2a claim, checks the escrow moved by
  # exactly the escrow minus the gas, pulls the result blob back out of the
  # `JobFulfilled` event, and then runs a second job to a timeout and a refund.
  # Every contract call and every assertion is real. What is fake is the
  # ciphertext: the blobs are random bytes of the right size, because nothing
  # in this job can evaluate FHE.
  #
  # The default mode — the one that runs three DISCA workers, stages one liar,
  # watches it outvoted 2-of-3 and then decisive at 3-of-3 — is deliberately
  # NOT here. It needs `cargo build --release -p node --features
  # fault-injection`, which is a different feature resolution from the `test`
  # job above and so shares no cache with it: an hour of tfhe, in a release
  # profile nothing else in this workflow builds, to re-check agreement that
  # `cargo test` already checks. It stays a local command, documented in the
  # script's header.
  #
  # So what this job actually gates is the chain half and the shell: that
  # `Deploy.s.sol` deploys, that the transactions this repo will demo with go
  # through, and that a refactor of DiscaBridge has not broken the script that
  # drives it. It says nothing about M-of-N.
  bridge-e2e:
    name: anvil end to end
    runs-on: ubuntu-latest
    # Under a minute in practice; the ceiling is here to catch an anvil that
    # never binds rather than to budget for work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # forge-std is a submodule (bridge/lib/forge-std); without this every
          # import in bridge/ fails.
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned; see the `contracts` job above for why this is not `stable`.
          version: v1.7.1
      # bash -n and shellcheck before running it: a syntax error inside a
      # branch the run does not take would otherwise ship green.
      # Every script in the repository, not just this job's two. The narrower
      # version passed while `spec/check.sh` had a `local` whose expansion
      # depended on the caller happening to name a variable the same thing —
      # the sort of thing shellcheck exists to catch, sitting in a file the lint
      # step did not look at.
      - name: lint the shell
        run: |
          git ls-files '*.sh'
          # One file per invocation: `bash -n a b` treats b as an argument to a,
          # so a second script would never be parsed at all.
          git ls-files '*.sh' | xargs -n1 bash -n
          git ls-files '*.sh' | xargs shellcheck
      - name: the round trip
        run: ./scripts/run-anvil.sh --synthetic
