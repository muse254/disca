[package]
name = "primitives"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
homepage.workspace = true

[features]
# The gate-composition route to FHE arithmetic (`logic_gates`). Off by default,
# so it is never compiled into a binary — nothing in the evaluation path uses
# it. Enable it to build or test that module; see its docs for why it is kept.
boolean-circuits = []

[dependencies]
tfhe = { workspace = true }
wasmparser = { workspace = true }
wast = { workspace = true }
serde = { workspace = true }
sha3 = { workspace = true }
wincode = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
rayon = { workspace = true }
tracing-subscriber = { workspace = true }
